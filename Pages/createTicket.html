<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Ticket | IT Support System</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

 
    <link rel="stylesheet" href="../Style/style.css" />
    <link rel="stylesheet" href="../Style/layout.css" />
    <link rel="stylesheet" href="../Style/components.css" />
    <link rel="stylesheet" href="../Style/createTickets.css" />
  </head>
  <body>
   
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"><i class="bi bi-shield-check"></i></div>
        <span>IT Support System</span>
      </div>

      <nav class="nav flex-column gap-1">
        <a class="nav-link" href="empDashboard.html"
          ><i class="bi bi-house-door-fill"></i><span>Dashboard</span></a
        >
        <a class="nav-link active" href="createTicket.html"
          ><i class="bi bi-pencil-square"></i><span>Create Ticket</span></a
        >
        <a class="nav-link" href="myTickets.html"
          ><i class="bi bi-ticket-detailed-fill"></i><span>My Tickets</span></a
        >
        <a class="nav-link" href="logout.html"
          ><i class="bi bi-box-arrow-left"></i><span>Logout</span></a
        >
      </nav>
    </aside>

   
    <div class="main-content">
      <header class="topbar">
        <div class="user-info">
          <div class="avatar">SM</div>
          <div>
            <div class="user-name">Sara Mohamed</div>
            <div class="user-role">Employee</div>
          </div>
        </div>
      </header>

      <main class="page-body">
        <div class="card-box ticket-card">
          <h2>Create New Ticket</h2>
          <p class="subtitle">
            Describe your issue and we'll help you as soon as possible.
          </p>

          <form>
            <div class="field">
              <label>Title</label>
              <input type="text" placeholder="Enter ticket title" required />
            </div>

            <div class="form-row">
              <div class="field">
                <label>Category</label>
                <select required>
                  <option value="" disabled selected>Select category</option>
                  <option value="hardware">Hardware</option>
                  <option value="software">Software</option>
                  <option value="network">Network</option>
                </select>
              </div>
              <div class="field">
                <label>Priority</label>
                <select required>
                  <option value="" disabled selected>Select priority</option>
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label>Description</label>
              <textarea
                placeholder="Describe your issue in detail..."
                required
              ></textarea>
            </div>

            <button type="submit" class="btn">Submit Ticket</button>
          </form>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
