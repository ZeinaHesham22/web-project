
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Support System | Login</title>

    <!-- Existing project styles -->
    <link rel="stylesheet" href="../Style/style.css">
    <link rel="stylesheet" href="../Style/components.css">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Login page styles -->
    <link rel="stylesheet" href="../Style/login.css">
</head>

<body class="login-page">

    <main class="login-container">

        <!-- Left Welcome Panel -->
        <section class="welcome-panel">

            <div class="welcome-content">

                <div class="welcome-logo">
                    <i class="bi bi-headset"></i>
                </div>

                <h1>IT Support System</h1>

                <p class="welcome-tagline">
                    Get help. Keep working.
                </p>

                <div class="welcome-illustration">
                    <i class="bi bi-laptop"></i>
                    <i class="bi bi-gear-fill gear-one"></i>
                    <i class="bi bi-gear-fill gear-two"></i>
                    <i class="bi bi-arrow-left-right connection-icon"></i>
                </div>

                <p class="welcome-footer">
                    Fast <span>•</span> Simple <span>•</span> Reliable
                </p>

            </div>

        </section>


        <!-- Right Login Panel -->
        <section class="login-panel">

            <div class="login-form-container">

                <header class="login-header">
                    <h2>Sign in to your account</h2>
                    <p>Choose your role and enter your credentials</p>
                </header>


                <!-- Role Selection -->
                <div class="role-selector" aria-label="Choose your role">

                    <button type="button"
                            class="role-option active"
                            data-role="employee"
                            aria-pressed="true">
                        Employee
                    </button>

                    <button type="button"
                            class="role-option"
                            data-role="it"
                            aria-pressed="false">
                        IT Support
                    </button>

                </div>


                <!-- Login Form -->
                <form class="login-form" action="#" method="post">

                    <input type="hidden"
                           name="role"
                           id="selected-role"
                           value="employee">

                    <div class="form-group">

                        <label for="email">Email Address</label>

                        <input type="email"
                               id="email"
                               name="email"
                               class="login-input"
                               placeholder="Enter your email"
                               autocomplete="username"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="password">Password</label>

                        <div class="password-wrapper">

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="login-input"
                                   placeholder="Enter your password"
                                   autocomplete="current-password"
                                   required>

                            <button type="button"
                                    class="password-toggle"
                                    id="toggle-password"
                                    aria-label="Show password">
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>


                    <button type="submit" class="login-button">
                        Login
                    </button>


                    <div class="forgot-password">
                        <a href="#" id="forgot-password">
                            Forgot password?
                        </a>
                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- Temporary interactions: HTML/CSS prototype -->
    <script>
        const roleButtons = document.querySelectorAll(".role-option");
        const selectedRole = document.getElementById("selected-role");

        roleButtons.forEach((button) => {
            button.addEventListener("click", () => {

                roleButtons.forEach((item) => {
                    item.classList.remove("active");
                    item.setAttribute("aria-pressed", "false");
                });

                button.classList.add("active");
                button.setAttribute("aria-pressed", "true");

                selectedRole.value = button.dataset.role;
            });
        });


        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("toggle-password");

        togglePassword.addEventListener("click", () => {

            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";

            togglePassword.innerHTML = isPassword
                ? '<i class="bi bi-eye-slash"></i>'
                : '<i class="bi bi-eye"></i>';

            togglePassword.setAttribute(
                "aria-label",
                isPassword ? "Hide password" : "Show password"
            );
        });


        document.querySelector(".login-form").addEventListener("submit", (event) => {
            event.preventDefault();

            alert("Login is a UI prototype. Backend authentication will be added later.");
        });

        document.getElementById("forgot-password").addEventListener("click", (event) => {
            event.preventDefault();

            alert("If you forget your password return to your system admin please.");
        });
    </script>

</body>
</html>
